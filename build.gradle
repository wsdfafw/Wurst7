buildscript {
	dependencies {
		classpath "org.kohsuke:github-api:1.330"
	}
}

plugins {
	id "fabric-loom" version "${loom_version}"
	id "com.diffplug.spotless" version "8.4.0"
}

def ENV = System.getenv()

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// net.wurstclient.ai.PathPos extends net.minecraft.util.math.BlockPos,
	// which uses javax.annotation.concurrent.Immutable, which is part of
	// the JSR305 library.
	//
	// In other words, Wurst won't compile without this library,
	// even though it's Minecraft that actually uses it.
	modImplementation "com.google.code.findbugs:jsr305:3.0.2"
}

fabricApi.configureTests {
	createSourceSet = true
	enableGameTests = false
	enableClientGameTests = true
	modId = "wurst_testmod"
	username = "Wurst-Bot"
}

loom {
	accessWidenerPath = file("src/main/resources/wurst.accesswidener")
	
	runs {
		clientGameTest {
			vmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
		}
		
		clientWithMods {
			inherit client
		}
		
		clientGameTestWithMods {
			inherit client
			source = sourceSets.gametest
			runDir = "build/run/clientGameTestWithMods"
			vmArgs.add("-Dfabric.client.gametest")
			vmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
			vmArgs.add("-Dwurst.test.withMods=true")
			programArgs.add("--username=Wurst-Bot")
		}
	}
}

configurations {
	testMods {
		transitive = false
	}
}

dependencies {
	testMods "maven.modrinth:sodium:${project.sodium_version}"
}

def cleanClientWithMods = tasks.register("cleanClientWithMods", Delete) {
	delete "run/mods"
}

def prepareClientWithMods = tasks.register("prepareClientWithMods", Sync) {
	from configurations.testMods
	into "run/mods"
}

tasks.named("runClientWithMods") {
	dependsOn prepareClientWithMods
	finalizedBy cleanClientWithMods
}

def cleanClientGameTestWithMods = tasks.register("cleanClientGameTestWithMods", Delete) {
	delete layout.buildDirectory.dir("run/clientGameTestWithMods")
}

def prepareClientGameTestWithMods = tasks.register("prepareClientGameTestWithMods", Sync) {
	dependsOn cleanClientGameTestWithMods
	from configurations.testMods
	into layout.buildDirectory.dir("run/clientGameTestWithMods/mods")
}

def doModCompatTest = providers.gradleProperty("do_mod_compat_test").map { it.toBoolean() }.orElse(false)
tasks.named("runClientGameTestWithMods") {
	onlyIf { doModCompatTest.get() }
	dependsOn prepareClientGameTestWithMods
}

processResources {
	def modVersion = project.version.substring(1)
	inputs.property("version", modVersion)
	
	filesMatching("fabric.mod.json") {
		expand(version: modVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.5 (24w14a) upwards uses Java 21.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def archivesName = project.base.archivesName
	inputs.property("archivesName", archivesName)
	
	from("LICENSE.txt") {
		rename { "LICENSE-${archivesName.get()}.txt" }
	}
	
	exclude("intentionally_untranslated.json")
}

import com.diffplug.spotless.generic.LicenseHeaderStep
spotless {
	lineEndings = "WINDOWS"
	java {
		removeUnusedImports()
		leadingSpacesToTabs()
		trimTrailingWhitespace()
		eclipse().configFile(file("codestyle/formatter.xml"))
	}
	format("licenseHeader") {
		target("src/*/java/**/*.java")
		def header_file = file("codestyle/license_header.txt")
		def delimiter = LicenseHeaderStep.DEFAULT_JAVA_HEADER_DELIMITER
		licenseHeaderFile(header_file, delimiter).updateYearWithLatest(true)
	}
	json {
		target("src/**/*.json", "src/**/*.mcmeta")
		gson().indentWithSpaces(2).version("2.11.0")
	}
}

test {
	useJUnitPlatform()
}

def getGhVersion() {
	return version.substring(0, version.indexOf("-MC"))
}

def getChangelogLink(String platform, String from) {
	def versionSlug = getGhVersion().substring(1).replace(".", "-")
	def shortURL = "https://www.wurstclient.net/updates/wurst-${versionSlug}/"
	def query = []
	if (platform != "GitHub")
		query.add("mc=${project.minecraft_version}")
	query.add("utm_source=${platform}")
	query.add("utm_medium=" + project.archives_base_name.replace("-", "+"))
	def fullURL = shortURL + (query.isEmpty() ? "" : "?" + query.join("&"))
	def encodedURL = java.net.URLEncoder.encode(fullURL, "UTF-8")
	return "[${shortURL}](https://go.wimods.net/from/${from}?to=${encodedURL})"
}

def getChangelogImage(String from) {
	return "![](https://img.wimods.net/${from})"
}

def getChangelog(String platform, String from) {
	def prefix = platform == "GitHub" ? "" : "A changelog can be found at: "
	def imgQuery = platform == "GitHub" ? "" : "?mc_version=${project.minecraft_version}&mod_loader=${project.mod_loader}"
	return prefix + getChangelogLink(platform, from) + getChangelogImage(from + imgQuery)
}

import org.kohsuke.github.GHReleaseBuilder
import org.kohsuke.github.GitHub

tasks.register('github') {
	dependsOn build
	onlyIf {
		ENV.GITHUB_TOKEN
	}

	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.mcx_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()

		def ghRelease = repository.getReleaseByTagName(ghVersion as String)
		if (ghRelease == null) {
			def releaseBuilder = new GHReleaseBuilder(repository, ghVersion as String)
			releaseBuilder.body(getChangelogImage("github.com/${repoId}/releases/tag/${ghVersion}"))
			releaseBuilder.prerelease(ghVersion.contains("pre"))
			ghRelease = releaseBuilder.create()
		}

		ghRelease.uploadAsset(remapJar.archiveFile.get().getAsFile(), "application/java-archive")
		ghRelease.uploadAsset(remapSourcesJar.archiveFile.get().getAsFile(), "application/java-archive")
	}
}

import org.kohsuke.github.GHIssueState
import org.kohsuke.github.GHMilestoneState
import java.time.Instant

tasks.register('closeMilestone') {
	onlyIf {
		ENV.GITHUB_TOKEN
	}

	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.gh_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()

		// Weird API design: listMilestones() requires GHIssueState while everything else uses GHMilestoneState.
		def milestone = repository.listMilestones(GHIssueState.ALL).find { it.title == ghVersion }
		if (milestone == null) {
			milestone = repository.createMilestone(ghVersion.toString(), "")
		}

		if (milestone.getState() != GHMilestoneState.CLOSED) {
			milestone.setDueOn(Date.from(Instant.now()))
			milestone.setDescription(getChangelog("GitHub", "github.com/${repoId}/milestone/${ghVersion}"))
			milestone.close()
		}
	}
}

// 定义任务
tasks.register('checkLocalization') {
	doLast {
		// 定义 zh_cn.json 文件路径
		def jsonFile = file('src/main/resources/assets/wurst/translations/zh_cn.json')
		// 以 UTF-8 编码读取 zh_cn.json 文件内容
		def jsonText = jsonFile.getText('UTF-8')
		// 解析 JSON 内容
		def json = new groovy.json.JsonSlurper().parseText(jsonText)

		// 用于存储已经发现的未添加的本地化键
		def missingKeys = new HashSet<String>()

		// 定义需要扫描的目录，这里直接扫描 Java 源文件目录
		def sourceDir = file('src/main/java')
		// 遍历目录下的所有 Java 文件
		sourceDir.eachFileRecurse { file ->
//			println "正在处理文件: ${file.absolutePath}"
			if (file.name.endsWith('.java')) {
				// 读取 Java 文件内容
				def fileText = file.text
				// 匹配构造函数中 super 方法调用传递的字符串参数
				def pattern = /super\s*\(\s*"([^"]+)"\s*\);/
				def matcher = (fileText =~ pattern)
				def uniqueParams = new HashSet<String>()
				matcher.each { match ->
					uniqueParams.add(match[1])
				}
				uniqueParams.each { param ->
					def originalParam = param
					def cleanedParam = param.replaceAll(/\s+/, "").replaceAll(/[\\p{C}]/, "")
					def originalKey = "description.wurst.hack.$originalParam".toLowerCase()
					def key = "description.wurst.hack.$cleanedParam".toLowerCase()
					println "原始参数: $originalParam"
					println "原始键: $originalKey"
					println "清理后键: $key"

					def jsonKeys = json.keySet().collect {
						def originalJsonKey = it
						def cleanedJsonKey = it.replaceAll(/\s+/, "").replaceAll(/[\\p{C}]/, "").toLowerCase()
//						println "原始 JSON 键: $originalJsonKey"
//						println "清理后 JSON 键: $cleanedJsonKey"
						cleanedJsonKey
					}

					def found = jsonKeys.find { jsonKey -> jsonKey == key }
					if (!found && !missingKeys.contains(key)) {
//						println "未添加到 zh_cn.json 的本地化键: $key"
						missingKeys.add(key)
					}
				}
			}
		}
	}
}

import groovy.json.JsonBuilder
import groovy.json.JsonOutput

// 自动更新I18n文件的任务
tasks.register('i18nUpdater') {
	doLast {
		def hacksDir = file('src/main/java/net/wurstclient/hacks')
		def translationsDir = file('src/main/resources/assets/wurst/translations')
		
		// 收集所有Hack类的名称
		def hackNames = [:]
		hacksDir.eachFileRecurse { file ->
			if (file.name.endsWith('.java')) {
				def fileText = file.text
				def pattern = /super\s*\(\s*"([^"]+)"\s*\);/
				def matcher = (fileText =~ pattern)
				if (matcher) {
					def hackName = matcher[0][1]
					def key = "description.wurst.hack.${hackName.toLowerCase().replaceAll(/[^a-z0-9\u4e00-\u9fa5]/, '')}"
					hackNames[key] = hackName
				}
			}
		}
		
		// 只更新中文翻译文件
		def zhCnFile = file('src/main/resources/assets/wurst/translations/zh_cn.json')
		if (zhCnFile.exists()) {
			def jsonText = zhCnFile.getText('UTF-8')
			def json = new groovy.json.JsonSlurper().parseText(jsonText)
			def updated = false
			
			hackNames.each { key, hackName ->
				// 只有当键不存在或键的值不是字符串时才添加
				if (!json.containsKey(key) || !(json[key] instanceof String)) {
					// 对于中文名称，添加"自动"前缀
					json[key] = "自动${hackName}"
					updated = true
				}
			}
			
			// 如果有更新，写回文件
			if (updated) {
				// 使用JsonBuilder确保正确的JSON格式
				def jsonBuilder = new JsonBuilder(json)
				def writer = new PrintWriter(new OutputStreamWriter(new FileOutputStream(zhCnFile), "UTF-8"))
				def jsonString = JsonOutput.prettyPrint(jsonBuilder.toString())
				// 解码Unicode转义字符
				def decodedString = decodeUnicodeEscapes(jsonString)
				writer.print(decodedString)
				writer.close()
				println "Updated file: ${zhCnFile.name}"
			}
		}
		
		println "I18n files updated successfully!"
	}
}

// 解码Unicode转义字符的辅助方法
def decodeUnicodeEscapes(String input) {
	def result = new StringBuilder()
	def i = 0
	while (i < input.length()) {
		if (input[i] == '\\' && i + 5 < input.length() && input[i+1] == 'u') {
			try {
				def hexCode = input.substring(i+2, i+6)
				def charVal = Integer.parseInt(hexCode, 16)
				result.append((char) charVal)
				i += 6
			} catch (NumberFormatException e) {
				result.append(input[i])
				i++
			}
		} else {
			result.append(input[i])
			i++
		}
	}
	return result.toString()
}

tasks.register('uploadBackups') {
	dependsOn build

	onlyIf {
		ENV.WI_BACKUPS_API_KEY
	}

	doLast {
		def shortVersion = getGhVersion().substring(1)
		def backupUrl = "https://api.wurstclient.net/artifact-backups/Wurst/${shortVersion}"

		def maxRetries = 3
		def retryCount = 0
		def success = false

		while (!success && retryCount < maxRetries) {
			try {
//				def connection = new URL(backupUrl).openConnection() as HttpURLConnection
//				def backupUrl = URI.create("https://api.wurstclient.net/artifact-backups/Wurst/${shortVersion}")
				def connection = backupUrl.toURL().openConnection() as HttpURLConnection
				def boundary = UUID.randomUUID().toString()
				connection.setRequestMethod("POST")
				connection.setRequestProperty("X-API-Key", ENV.WI_BACKUPS_API_KEY)
				connection.setRequestProperty("Accept", "application/json")
				connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
				connection.doOutput = true

				def output = connection.outputStream
				[remapJar, remapSourcesJar].each { jarTask ->
					def file = jarTask.archiveFile.get().asFile
					output << "--${boundary}\r\n"
					output << "Content-Disposition: form-data; name=\"files\"; filename=\"${file.name}\"\r\n"
					output << "Content-Type: application/java-archive\r\n\r\n"
					file.withInputStream { input ->
						output << input
					}
					output << "\r\n"
				}
				output << "--${boundary}--\r\n"
				output.flush()

				if (connection.responseCode != 200) {
					throw new IOException("HTTP ${connection.responseCode}: ${connection.responseMessage}")
				}

				success = true

			} catch (Exception e) {
				retryCount++
				if (retryCount >= maxRetries) {
					throw new GradleException("Failed to upload backups after ${maxRetries} attempts: ${e.message}")
				}
				println "Upload attempt ${retryCount} failed: ${e.message}. Retrying in 5 seconds..."
				Thread.sleep(5000)
			}
		}
	}
}
