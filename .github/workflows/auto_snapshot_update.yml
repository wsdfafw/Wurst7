# Experimental workflow to automate updating to a new Minecraft snapshot.
name: Auto Snapshot Update

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: "要更新的Minecraft版本"
        required: true
      yarn_mappings:
        description: "Yarn映射版本 (no longer used)"
        required: false
      fabric_loader:
        description: "Fabric Loader版本"
        required: true
      fapi_version:
        description: "Fabric API版本"
        required: true
      distinct_id:
        required: false

permissions:
  # To push changes to the snapshot branch.
  contents: write
  # To trigger the CI workflow.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ inputs.distinct_id }}
      run: echo ${{ inputs.distinct_id }}

    - name: 检出仓库
      uses: actions/checkout@v6

    - name: 设置Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Update version constants
      run: |
        python scripts/update_version_constants.py \
          "${{ inputs.mc_version }}" \
          "${{ inputs.fabric_loader }}" \
          "${{ inputs.fapi_version }}"

    # 修复迁移脚本可能引起的任何样式问题
    - name: 运行spotlessApply任务
      run: ./gradlew spotlessApply

    - name: 提交并推送更改
      run: |
        git config --global user.name "lroj-Bot"
        git config --global user.email "contact.wurstimperium@gmail.com"
        git add .
        git commit -m "[lroj-Bot] 更新到 ${{ inputs.mc_version }}"
        git push

    - name: Trigger CI
      uses: Wurst-Imperium/dispatch-and-wait@v1
      with:
        token: ${{ github.token }}
        owner: ${{ github.repository_owner }}
        repo: ${{ github.event.repository.name }}
        ref: ${{ github.ref }}
        workflow: gradle.yml
        run_timeout_seconds: 600  # 10 minutes
